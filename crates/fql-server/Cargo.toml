[package]
name = "fql-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
fql-ast = { version = "0.1.0", path = "../fql-ast" }
fql-engine = { version = "0.1.0", path = "../fql-engine" }
fql-parser = { version = "0.1.0", path = "../fql-parser" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
