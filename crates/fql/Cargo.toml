[package]
name = "fql"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
fql-ast = { version = "0.1.0", path = "../fql-ast" }
fql-engine = { version = "0.1.0", path = "../fql-engine" }
fql-parser = { version = "0.1.0", path = "../fql-parser" }
fql-server = { version = "0.1.0", path = "../fql-server" }
miette = { version = "7.6.0", features = ["fancy"] }
serde_json = "1.0.151"
tabled = "0.22.0"
tokio = { version = "1.53.1", features = ["full"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
serde = { version = "1.0.229", features = ["derive"] }
